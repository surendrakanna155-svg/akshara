name: Backend Staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "openapi/**"
      - "backend/**"
      - ".github/workflows/backend_staging.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "openapi/**"
      - "backend/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno unit tests
        run: deno test --allow-env supabase/functions/_shared/

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SQL migrations parse
        run: supabase db lint --local || true

  deploy-staging:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID_STAGING" ]; then
            echo "Staging secrets not configured — skipping deploy"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID_STAGING"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID_STAGING" ]; then
            exit 0
          fi
          supabase db push

      - name: Deploy api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID_STAGING" ] || [ -z "$JWT_SECRET" ]; then
            exit 0
          fi
          supabase secrets set \
            APP_ENV=staging \
            AUTH_OTP_DEV_MODE=true \
            JWT_SECRET="$JWT_SECRET"
          supabase functions deploy api --no-verify-jwt
