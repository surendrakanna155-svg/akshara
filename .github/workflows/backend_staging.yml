name: Backend Staging

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "openapi/**"
      - "backend/**"
      - ".github/workflows/backend_staging.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "openapi/**"
      - "backend/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno unit tests
        run: deno test --allow-env --allow-read supabase/functions/_shared/

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SQL migrations parse
        run: supabase db lint --local || true

  deploy-staging:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Require staging secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID_STAGING JWT_SECRET; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required staging secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Staging deploy blocked — configure secrets in the staging environment."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID_STAGING"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
        run: supabase db push

      - name: Deploy api function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ERP_TENANT_DATABASE_URL: ${{ secrets.ERP_TENANT_DATABASE_URL }}
        run: |
          if [ -n "$ERP_TENANT_DATABASE_URL" ]; then
            supabase secrets set \
              APP_ENV=staging \
              AUTH_OTP_DEV_MODE=true \
              JWT_SECRET="$JWT_SECRET" \
              ERP_TENANT_DATABASE_URL="$ERP_TENANT_DATABASE_URL" \
              INTERNAL_HEALTH_TOKEN="${{ secrets.INTERNAL_HEALTH_TOKEN }}"
          else
            echo "::warning::ERP_TENANT_DATABASE_URL not configured — tenant DB may be unavailable"
            supabase secrets set \
              APP_ENV=staging \
              AUTH_OTP_DEV_MODE=true \
              JWT_SECRET="$JWT_SECRET"
          fi
          supabase functions deploy api --no-verify-jwt
