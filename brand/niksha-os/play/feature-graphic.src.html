<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:500px;overflow:hidden}
  /* Brand rule 1: the gradient runs bottom-left -> top-right. Always. */
  .g{width:1024px;height:500px;position:relative;
     background:linear-gradient(38deg,#0B1F4B 0%,#1E3A8A 46%,#2563EB 82%,#38BDF8 128%);
     display:flex;align-items:center;justify-content:center;gap:52px;padding:0 64px;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  /* Faint ascending rule echoing the mark's data-squares motif. */
  .g::after{content:"";position:absolute;inset:0;pointer-events:none;
     background:
       linear-gradient(38deg,transparent 62%,rgba(56,189,248,.13) 62.4%,transparent 63%),
       linear-gradient(38deg,transparent 71%,rgba(255,255,255,.07) 71.3%,transparent 72%)}
  .sym{width:206px;height:206px;flex:none;position:relative;z-index:1}
  .txt{position:relative;z-index:1}
  h1{font-size:74px;line-height:1;font-weight:700;letter-spacing:-.028em;color:#fff}
  /* Green is an accent, never a fill (brand rule 2). */
  .rule{width:76px;height:5px;border-radius:3px;background:#10B981;margin:22px 0 20px}
  p{font-size:29px;line-height:1.32;font-weight:450;color:rgba(255,255,255,.93);letter-spacing:-.006em}
  .sub{font-size:20px;color:rgba(255,255,255,.72);margin-top:16px;letter-spacing:.005em}
</style></head><body>
