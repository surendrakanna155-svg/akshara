<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NIKSHA Technologies symbol">
  <title>NIKSHA Technologies — symbol</title>
  <desc>An N monogram whose trailing edge dissolves into data squares. Pure vector geometry; no raster data.</desc>

  <defs>
    <!-- Corporate gradient: engineering blue resolving into intelligence violet.
         Distinct from NIKSHA OS (which stays blue→sky) so the parent company
         and the school product are never mistaken for one another. -->
    <linearGradient id="nt-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="nt-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- ─── N monogram ────────────────────────────────────────────────────────
       Same three-prism construction as the NIKSHA OS mark — shared skeleton,
       different treatment — so the family reads as one system. Baseline y=396,
       cap y=116. -->
  <g fill="url(#nt-grad)">
    <path d="M96 116 H152 V396 H96 Z"/>
    <path d="M152 116 H208 L300 268 V396 H264 L152 216 Z"/>
    <path d="M300 116 H356 V396 H300 Z"/>
  </g>

  <!-- ─── Dissolve ──────────────────────────────────────────────────────────
       The monogram's trailing edge breaks into squares on a diagonal: knowledge
       becoming data. Each step halves in size and drops in opacity, so the
       sequence still reads as motion at small sizes rather than as noise. -->
  <g fill="url(#nt-fade)">
    <rect x="372" y="150" width="34" height="34" rx="8"/>
    <rect x="418" y="196" width="26" height="26" rx="6" opacity="0.82"/>
    <rect x="376" y="232" width="20" height="20" rx="5" opacity="0.66"/>
    <rect x="424" y="268" width="15" height="15" rx="4" opacity="0.50"/>
    <rect x="382" y="300" width="11" height="11" rx="3" opacity="0.36"/>
    <rect x="420" y="330" width="8" height="8" rx="2" opacity="0.24"/>
  </g>
</svg>
