# Akshara isolated self-host (lean Supabase) — VPS 46.28.44.46, all localhost-only.
# Stage 1-3 checkpoint: Postgres only. Stage 4 adds postgrest + rest-gateway + edge.
name: akshara
services:
  akshara-postgres:
    image: public.ecr.aws/supabase/postgres:17.6.1.127
    container_name: akshara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - akshara_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks: [akshara-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  akshara-net: { name: akshara-net, driver: bridge }
volumes:
  akshara_pgdata: { name: akshara_pgdata }
