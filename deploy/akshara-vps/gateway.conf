# Maps supabase-js's SUPABASE_URL (/rest/v1/*) to PostgREST. Internal only.
server {
  listen 8080;
  location = /health { default_type text/plain; return 200 "gateway-ok\n"; }
  location /rest/v1/ {
    proxy_pass http://akshara-postgrest:3000/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
  }
}
