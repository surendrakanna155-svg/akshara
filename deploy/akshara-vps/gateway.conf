# Maps supabase-js's SUPABASE_URL to internal services. Internal only.
#   /rest/v1/*    -> PostgREST
#   /storage/v1/* -> Storage API (Batch 7)
server {
  listen 8080;
  client_max_body_size 60m;   # School Memories media uploads (bucket limit 50MB + overhead)
  location = /health { default_type text/plain; return 200 "gateway-ok\n"; }
  location /rest/v1/ {
    proxy_pass http://akshara-postgrest:3000/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
  }
  # Strip the /storage/v1 prefix and forward to storage-api at :5000.
  location /storage/v1/ {
    proxy_pass http://akshara-storage:5000/;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header apikey $http_apikey;
    proxy_request_buffering off;   # stream large uploads instead of buffering to disk
  }
}
