# NIKSHA OS — public legal site (nginx vhost).
#
# Serves the statically generated legal pack from deploy/akshara-vps/public/ at
# the policy host. This is a PUBLIC vhost — unlike gateway.conf, which is
# internal-only and proxies the API.
#
# Why this file exists
# --------------------
# The Play Console "Privacy Policy" field and the app's in-app legal links both
# resolve against this host. Until now the page was served by hand-placed config
# that existed only on the VPS and in nobody's repository: a container rebuild or
# a host migration would silently 404 the privacy URL and take the app out of
# Play compliance with no signal. Keeping the vhost in the repo makes the
# mandatory page reproducible.
#
# Generate the content first — the HTML is NEVER hand-edited:
#   node scripts/legal/build_legal_site.js
#
# That command exits non-zero while any owner placeholder (e.g. [GRIEVANCE EMAIL])
# is still unfilled. Do not publish while it is failing: Google Play requires a
# working privacy contact and the DPDP Act requires a named Grievance Officer.
# deploy/akshara-vps/public/_PUBLISH_GATE.json records the current status.
#
# Install:
#   scp -r deploy/akshara-vps/public/  root@<host>:/opt/akshara/legal-site/
#   scp deploy/akshara-vps/legal-site.conf root@<host>:/etc/nginx/sites-available/niksha-legal
#   ln -sf /etc/nginx/sites-available/niksha-legal /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# TLS is terminated by the existing Let's Encrypt certificate for this host; the
# certbot-managed listen/ssl_certificate lines are added by `certbot --nginx` and
# are intentionally not duplicated here.

server {
  listen 80;
  server_name _;   # OWNER: replace with the real policy host once the domain is bought.

  root /opt/akshara/legal-site;
  index index.html;

  charset utf-8;

  # Extensionless canonical URLs. /privacy -> privacy.html, /terms/user ->
  # terms/user.html. These paths are contractual: they must match `path` in
  # supabase/functions/_shared/legal/legal_catalog.ts, which the app joins to the
  # policy host to build its "view full policy" links.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # The publish gate is build metadata, not public content. Serving it would leak
  # the list of unfilled legal placeholders.
  location = /_PUBLISH_GATE.json { return 404; }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Policies are amended in place and the app compares versions on launch, so a
  # stale cached copy can show a parent the wrong terms. Keep it short.
  location ~ \.html$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Static documents only — no scripts, no third-party anything. A regulator or a
  # Play reviewer opening this page should be able to see that at a glance.
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;

  gzip on;
  gzip_types text/html text/css application/json image/svg+xml;

  access_log /var/log/nginx/niksha-legal.access.log;
  error_log  /var/log/nginx/niksha-legal.error.log;
}
