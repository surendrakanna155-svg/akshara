# NIKSHA OS — nikshaos.in three-host architecture.
#
#   nikshaos.in + www.nikshaos.in  -> product website (static)   /var/www/nikshaos-site
#   app.nikshaos.in                -> web ERP SPA (static)       /var/www/nikshaos-app
#   api.nikshaos.in                -> backend API (deno edge :3000) + storage (:5000)
#
# ISOLATED server blocks. NEVER edit the akshara / chotu-api / velora-salon /
# parental-monitor site files — this VPS is shared with unrelated production.
#
# Install:
#   cp deploy/nikshaos/nginx/nikshaos.conf /etc/nginx/sites-available/nikshaos
#   ln -sfn /etc/nginx/sites-available/nikshaos /etc/nginx/sites-enabled/nikshaos
#   nginx -t && systemctl reload nginx
#
# Certificate (single cert, 4 SANs):
#   certbot certonly --webroot -w /var/www/nikshaos-acme \
#     -d nikshaos.in -d www.nikshaos.in -d api.nikshaos.in -d app.nikshaos.in \
#     --cert-name nikshaos.in
#
# Rollback: remove the sites-enabled symlink, `nginx -t && systemctl reload nginx`.

# ---------------------------------------------------------------------------
# Port 80 — ACME + permanent redirect to HTTPS, for all four names.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name nikshaos.in www.nikshaos.in api.nikshaos.in app.nikshaos.in;

    location /.well-known/acme-challenge/ {
        root /var/www/nikshaos-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# api.nikshaos.in — backend API. Replaces akshara.veloraunisexsalon.com.
# Routes are served at the ROOT (no /v1 prefix); the edge owns its own routing.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.nikshaos.in;

    ssl_certificate     /etc/letsencrypt/live/nikshaos.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikshaos.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Mirrors the legacy vhost: admissions/document uploads need headroom.
    client_max_body_size 60M;

    access_log /var/log/nginx/nikshaos-api.access.log;
    error_log  /var/log/nginx/nikshaos-api.error.log;

    # Supabase Storage: strip the /storage/v1 prefix -> storage-api on localhost.
    location /storage/v1/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# app.nikshaos.in — web ERP single-page app.
# Calls api.nikshaos.in cross-origin; the edge sends
# `Access-Control-Allow-Origin: *` and auth is a bearer header (not a cookie),
# so no credentialed-CORS configuration is required.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.nikshaos.in;

    ssl_certificate     /etc/letsencrypt/live/nikshaos.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikshaos.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nikshaos-app;
    index index.html;

    access_log /var/log/nginx/nikshaos-app.access.log;
    error_log  /var/log/nginx/nikshaos-app.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-hashed bundle assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy strands clients on old JS.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# nikshaos.in + www — product website. Canonicalises www -> apex.
# Also the canonical home of the hosted legal documents (/privacy, /terms/*),
# which is what LegalLinks.policyHostBaseUrl and the Play Console field point at.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nikshaos.in;

    ssl_certificate     /etc/letsencrypt/live/nikshaos.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikshaos.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nikshaos.in$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nikshaos.in;

    ssl_certificate     /etc/letsencrypt/live/nikshaos.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nikshaos.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nikshaos-site;
    index index.html;

    access_log /var/log/nginx/nikshaos-site.access.log;
    error_log  /var/log/nginx/nikshaos-site.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Extensionless legal routes: /privacy -> privacy.html, /terms/user -> terms/user.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
