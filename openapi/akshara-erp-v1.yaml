  /parent/profile:
    get:
      operationId: getParentProfile
      tags: [Parent]
      summary: Parent profile and linked children
      parameters:
        - name: activeChildId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Profile envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/payments/{installmentId}:
    get:
      operationId: getParentPaymentSummary
      tags: [Parent]
      summary: Parent payment summary for installment
      parameters:
        - name: installmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Payment summary envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /teacher/dashboard:
    get:
      operationId: getTeacherDashboard
      tags: [Teacher]
