  /teacher/leave:
    get:
      operationId: getTeacherLeaveHistory
      tags: [Teacher]
      summary: Teacher leave request history
      responses:
        '200':
          description: Leave list envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'

  /teacher/leave/balance:
    get:
      operationId: getTeacherLeaveBalance
      tags: [Teacher]
      summary: Teacher leave balance
      responses:
        '200':
          description: Leave balance envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /teacher/messages:
    get:
      operationId: getTeacherMessages
      tags: [Teacher]
      summary: Teacher parent message threads
      responses:
        '200':
          description: Message list envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'

  /student/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [Student]
      summary: Student mobile dashboard
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /student/attendance:
    get:
      operationId: getStudentAttendance
      tags: [Student]
      summary: Student attendance month view
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: Attendance envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /student/homework:
    get:
      operationId: getStudentHomework
      tags: [Student]
      summary: Student homework items
      responses:
        '200':
          description: Homework list envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvelope'

  /student/exams:
    get:
      operationId: getStudentExams
      tags: [Student]
      summary: Student exams schedule and results
      responses:
        '200':
          description: Exams envelope
          content:
