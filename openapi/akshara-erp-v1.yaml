  /student/profile:
    get:
      operationId: getStudentProfile
      tags: [Student]
      summary: Student profile
      responses:
        '200':
          description: Profile envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /audit/events/batch:
    post:
      operationId: uploadAuditBatch
      tags: [Audit]
      summary: Ingest a batch of client audit events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditBatchUploadRequest'
      responses:
        '200':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditBatchUploadResponse'

components:
  parameters:
    MonthQuery:
      name: month
      in: query
      required: true
      description: Attendance month in YYYY-MM format
      schema:
        type: string
        pattern: '^[0-9]{4}-[0-9]{2}$'

  schemas:
    ApiEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
        error:
          $ref: '#/components/schemas/ApiError'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    DashboardEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [kpis]
              properties:
                kpis:
                  type: array
                  items:
                    $ref: '#/components/schemas/KpiItem'

    ListEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    type: object

    KpiItem:
      type: object
      required: [id, value, label]
      properties:
        id:
          type: string
        value:
          type: string
        label:
          type: string
        accentName:
          type: string
        detail:
          type: string

    PermissionItem:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
        source:
          type: string

    AuthPermissionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/PermissionItem'

    AuthUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, displayName, role]
              properties:
                id:
                  type: string
                displayName:
                  type: string
                role:
                  type: string
                tenantId:
                  type: string
                schoolId:
                  type: string
                organizationId:
                  type: string
                email:
                  type: string

    AuditEventPayload:
      type: object
      required: [id, type, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        tenantId:
          type: string
        schoolId:
          type: string
        correlationId:
          type: string
        category:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    AuditBatchUploadRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuditEventPayload'

    AuditBatchUploadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [acceptedCount]
              properties:
                acceptedCount:
                  type: integer
                rejectedIds:
                  type: array
                  items:
                    type: string
