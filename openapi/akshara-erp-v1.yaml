              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /transport/dashboard:
    get:
      operationId: getTransportDashboard
      tags: [Transport]
      summary: Transport dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/dashboard:
    get:
      operationId: getParentDashboard
      tags: [Parent]
      summary: Parent mobile dashboard
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/attendance:
    get:
      operationId: getParentAttendance
      tags: [Parent]
      summary: Parent child attendance month view
      parameters:
        - $ref: '#/components/parameters/MonthQuery'
      responses:
        '200':
          description: Attendance envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/homework:
    get:
      operationId: getParentHomework
      tags: [Parent]
      summary: Parent homework list
      responses:
        '200':
          description: Homework envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/exams:
    get:
      operationId: getParentExams
      tags: [Parent]
      summary: Parent exams schedule and results
      responses:
        '200':
          description: Exams envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /parent/timetable:
    get:
      operationId: getParentTimetable
      tags: [Parent]
      summary: Parent child weekly timetable
      responses:
        '200':
          description: Timetable envelope
          content:
