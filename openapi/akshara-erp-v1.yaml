openapi: 3.0.3
info:
  title: Akshara ERP API
  version: 1.0.0
  description: |
    Contract source of truth for live ERP modules (Auth, Admissions, Finance, SIS, HR, Transport, Audit).
    Client contract tests validate fixture and staging responses against these schemas.

servers:
  - url: https://staging-api.aksharaerp.com/v1
    description: Staging
  - url: https://api.aksharaerp.com/v1
    description: Production

paths:
  /auth/permissions:
    get:
      operationId: getAuthPermissions
      tags: [Auth]
      summary: Fetch server RBAC permissions for the active session
      responses:
        '200':
          description: Permission policy envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPermissionsEnvelope'

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Fetch current authenticated user
      responses:
        '200':
          description: User envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /admissions/dashboard:
    get:
      operationId: getAdmissionsDashboard
      tags: [Admissions]
      summary: Admissions dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /finance/dashboard:
    get:
      operationId: getFinanceDashboard
