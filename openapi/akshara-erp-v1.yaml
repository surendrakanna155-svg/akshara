openapi: 3.0.3
info:
  title: Akshara ERP API
  version: 1.0.0
  description: |
    Contract source of truth for live ERP modules (Auth, Admissions, Finance, SIS, HR, Transport, Audit).
    Client contract tests validate fixture and staging responses against these schemas.

servers:
  - url: https://staging-api.aksharaerp.com/v1
    description: Staging
  - url: https://api.aksharaerp.com/v1
    description: Production

paths:
  /auth/permissions:
    get:
      operationId: getAuthPermissions
      tags: [Auth]
      summary: Fetch server RBAC permissions for the active session
      responses:
        '200':
          description: Permission policy envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPermissionsEnvelope'

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Fetch current authenticated user
      responses:
        '200':
          description: User envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'

  /admissions/dashboard:
    get:
      operationId: getAdmissionsDashboard
      tags: [Admissions]
      summary: Admissions dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /finance/dashboard:
    get:
      operationId: getFinanceDashboard
      tags: [Finance]
      summary: Finance dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /sis/dashboard:
    get:
      operationId: getSisDashboard
      tags: [SIS]
      summary: SIS dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /hr/dashboard:
    get:
      operationId: getHrDashboard
      tags: [HR]
      summary: HR dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /transport/dashboard:
    get:
      operationId: getTransportDashboard
      tags: [Transport]
      summary: Transport dashboard KPIs
      responses:
        '200':
          description: Dashboard envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardEnvelope'

  /audit/events/batch:
    post:
      operationId: uploadAuditBatch
      tags: [Audit]
      summary: Ingest a batch of client audit events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditBatchUploadRequest'
      responses:
        '200':
          description: Batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditBatchUploadResponse'

components:
  schemas:
    ApiEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
        error:
          $ref: '#/components/schemas/ApiError'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    DashboardEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [kpis]
              properties:
                kpis:
                  type: array
                  items:
                    $ref: '#/components/schemas/KpiItem'

    KpiItem:
      type: object
      required: [id, value, label]
      properties:
        id:
          type: string
        value:
          type: string
        label:
          type: string
        accentName:
          type: string
        detail:
          type: string

    PermissionItem:
      type: object
      required: [permission]
      properties:
        permission:
          type: string
        source:
          type: string

    AuthPermissionsEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/PermissionItem'

    AuthUserEnvelope:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [id, displayName, role]
              properties:
                id:
                  type: string
                displayName:
                  type: string
                role:
                  type: string
                tenantId:
                  type: string
                schoolId:
                  type: string
                organizationId:
                  type: string
                email:
                  type: string

    AuditEventPayload:
      type: object
      required: [id, type, timestamp]
      properties:
        id:
          type: string
        type:
          type: string
        timestamp:
          type: string
          format: date-time
        userId:
          type: string
        tenantId:
          type: string
        schoolId:
          type: string
        correlationId:
          type: string
        category:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string

    AuditBatchUploadRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuditEventPayload'

    AuditBatchUploadResponse:
      allOf:
        - $ref: '#/components/schemas/ApiEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [acceptedCount]
              properties:
                acceptedCount:
                  type: integer
                rejectedIds:
                  type: array
                  items:
                    type: string
