name: akshara_erp
description: Akshara ERP — multi-tenant school SaaS platform.
publish_to: 'none'
version: 18.6.2+187

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase Cloud Messaging (push notifications). firebase_core initializes the
  # app from firebase_options.dart; firebase_messaging handles tokens + messages.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Virtual clock for time-based unit tests (e.g. the search debouncer).
  fake_async: ^1.3.1
  flutter_lints: ^5.0.0
  patrol: ^4.6.1
  integration_test:
    sdk: flutter
  # Generates Android (legacy + adaptive) launcher icons from the branded
  # source PNGs in assets/branding/. Regenerate after changing the source art:
  #   flutter pub run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

# Launcher icon configuration. Run `flutter pub run flutter_launcher_icons`
# to (re)generate the mipmap resources under android/app/src/main/res/.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  # Adaptive icon (Android 8.0+): brand background + transparent foreground.
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter:
  uses-material-design: true

patrol:
  app_name: Akshara ERP
  test_directory: patrol_test
  android:
    package_name: com.akshara.erp
  ios:
    bundle_id: com.akshara.erp.aksharaErp
