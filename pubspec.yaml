name: akshara_erp
description: Akshara ERP — multi-tenant school SaaS platform.
publish_to: 'none'
version: 18.6.2+187

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  patrol: ^4.6.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

patrol:
  app_name: Akshara ERP
  test_directory: patrol_test
  android:
    package_name: com.akshara.erp
  ios:
    bundle_id: com.akshara.erp.aksharaErp
