# Persona — Principal (QA instant login → management dashboard)
# tags: persona,principal,erp
appId: com.akshara.erp
env:
  ACCOUNT_CHIP: Principal
---
- runFlow:
    file: ../maestro/flows/_shared/mobile_demo_login.yaml
    env:
      ACCOUNT_CHIP: Principal
- extendedWaitUntil:
    visible:
      text: "Principal overview"
    timeout: 25000
- takeScreenshot: principal_dashboard
