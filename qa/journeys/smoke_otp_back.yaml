# Smoke — QA persona login reaches dashboard (no OTP)
# tags: smoke,qa-login
appId: com.akshara.erp
---
- runFlow:
    file: ../maestro/flows/_shared/qa_persona_login.yaml
    env:
      QA_PERSONA: Parent
- extendedWaitUntil:
    visible:
      text: "Fees"
    timeout: 15000
- takeScreenshot: smoke_qa_parent_dashboard
