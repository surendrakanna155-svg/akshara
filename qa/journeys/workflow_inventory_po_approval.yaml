    file: ../maestro/flows/_shared/staff_demo_login.yaml
    env:
      ERP_ROLE: Principal
- tapOn: "Approvals"
- tapOn: "Inventory"
- tapOn: "Approve"
- takeScreenshot: workflow_principal_po_approve
