# Workflow — Student registry (SIS)
# tags: workflow,student,sis,erp
appId: com.akshara.erp
---
- runFlow:
    file: ../maestro/flows/_shared/staff_demo_login.yaml
    env:
      STAFF_PHONE: "9999999999"
      ERP_ROLE: "Super Admin"
- runFlow:
    file: ../maestro/flows/_shared/erp_open_module.yaml
    env:
      MODULE_LABEL: Student SIS
- assertVisible: "Total Students"
- takeScreenshot: workflow_student_sis
